    button.btn-danger { background: #d9534f; }
    button.btn-danger:hover { background: #c9302c; }
    button.btn-secondary { background: #6c757d; }

<body>

  <div id="app-container">

      <h1>SFI Inspector Directory & Locator</h1>
      <button class="btn-secondary" onclick="logout()">Lock App</button>
    </div>

    <!-- 1. Search Box -->
    <div class="card">
      <h2>Find Nearest 3 Inspectors</h2>
      <div class="form-row">
        <input type="text" id="searchZip" placeholder="Enter 5-digit ZIP" maxlength="5">
        <button onclick="findNearest()">Locate Inspectors</button>
      </div>
      <div id="searchStatus" class="status"></div>

    <!-- 2. Add Inspector Form -->

      <h2>Add New Inspector</h2>
      <form id="addForm" onsubmit="addInspector(event)">

          <input type="text" id="state" placeholder="State (e.g. IN)" size="5" required>
          <input type="text" id="zip" placeholder="ZIP" maxlength="5" size="7" required>
        </div>
        <div class="form-row">
          <input type="text" id="phone" placeholder="Phone">
          <input type="email" id="email" placeholder="Email">
          <input type="text" id="sfi" placeholder="SFI #" size="8">
          <input type="text" id="expires" placeholder="Expires (MM/DD/YYYY)">
          <button type="submit">Save Inspector</button>
        </div>
      </form>
      <div id="addStatus" class="status"></div>
    </div>

    <!-- 3. Current Directory Table -->

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Current Roster (<span id="count">0</span>)</h2>
        <div>
          <button class="btn-secondary" onclick="exportCSV()">Export to CSV</button>
          <button class="btn-danger" onclick="resetToDefault()">Reset Defaults</button>
        </div>
      </div>
      <table id="rosterTable">

            <th>Name</th>
            <th>Address</th>
            <th>City, State</th>
            <th>ZIP</th>
            <th>Phone</th>
            <th>Email</th>
            <th>SFI #</th>

let inspectors = JSON.parse(localStorage.getItem('inspectors')) || defaultInspectors;

function saveInspectors() {
  localStorage.setItem('inspectors', JSON.stringify(inspectors));
  renderRoster();
}

function renderRoster() {
  const tbody = document.getElementById('rosterBody');
  tbody.innerHTML = '';
  document.getElementById('count').textContent = inspectors.length;

  inspectors.forEach((insp, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${insp.First} ${insp.Last}</td>
      <td>${insp.Address || ''}</td>
      <td>${insp.City}, ${insp.State}</td>
      <td>${insp.Zip}</td>
      <td>${insp.Phone || ''}</td>
      <td>${insp.Email || ''}</td>
      <td>${insp.SFI || ''}</td>
      <td>${insp.Expires || ''}</td>
      <td><button class="btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteInspector(${idx})">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function deleteInspector(index) {
  if (confirm(`Remove ${inspectors[index].First} ${inspectors[index].Last}?`)) {
    inspectors.splice(index, 1);
    saveInspectors();
  }
}

async function fetchCoords(zip) {
  const cleanZip = String(zip).padStart(5, '0');
  const res = await fetch(`https://api.zippopotam.us/us/${cleanZip}`);
  if (!res.ok) throw new Error("ZIP not found");
  const data = await res.json();
  return {
    lat: parseFloat(data.places[0].latitude),
    lon: parseFloat(data.places[0].longitude),
    city: data.places[0]['place name'],
    state: data.places[0]['state abbreviation']
  };
}

async function addInspector(e) {
  e.preventDefault();
  const status = document.getElementById('addStatus');
  const zip = document.getElementById('zip').value.trim();
  status.textContent = "Geocoding location...";

  try {
    const coords = await fetchCoords(zip);
    inspectors.push({
      First: document.getElementById('first').value.trim(),
      Last: document.getElementById('last').value.trim(),
      Address: document.getElementById('address').value.trim(),
      City: document.getElementById('city').value.trim() || coords.city,
      State: document.getElementById('state').value.trim() || coords.state,
      Zip: zip,
      Phone: document.getElementById('phone').value.trim(),
      Email: document.getElementById('email').value.trim(),
      SFI: document.getElementById('sfi').value.trim(),
      Expires: document.getElementById('expires').value.trim(),
      lat: coords.lat,
      lon: coords.lon
    });
    saveInspectors();
    document.getElementById('addForm').reset();
    status.style.color = "green";
    status.textContent = "Inspector successfully added!";
  } catch (err) {
    status.style.color = "red";
    status.textContent = "Failed to geocode ZIP code. Please verify it is a valid 5-digit US ZIP.";
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 3958.8; // Miles
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function findNearest() {
  const zip = document.getElementById('searchZip').value.trim();
  const status = document.getElementById('searchStatus');
  const resultsArea = document.getElementById('resultsArea');
  resultsArea.innerHTML = '';

  if (!zip || zip.length !== 5) {
    status.textContent = "Please enter a valid 5-digit ZIP code.";
    status.style.color = "red";
    return;
  }

  status.style.color = "#333";
  status.textContent = "Calculating distances...";

  try {
    const target = await fetchCoords(zip);
    status.textContent = `Showing 3 closest inspectors to ${target.city}, ${target.state} (${zip}):`;

    const ranked = inspectors.map(insp => {
      const dist = haversine(target.lat, target.lon, insp.lat, insp.lon);
      return { ...insp, distance: dist };
    }).sort((a, b) => a.distance - b.distance).slice(0, 3);

    let html = `<table>
      <thead>
        <tr>
          <th>Distance</th><th>Name</th><th>Address</th><th>City, State</th><th>ZIP</th><th>Phone</th><th>Email</th><th>SFI #</th>
        </tr>
      </thead><tbody>`;

    ranked.forEach(r => {
      html += `<tr class="highlight">
        <td><strong>${r.distance.toFixed(1)} miles</strong></td>
        <td>${r.First} ${r.Last}</td>
        <td>${r.Address || ''}</td>
        <td>${r.City}, ${r.State}</td>
        <td>${r.Zip}</td>
        <td>${r.Phone || ''}</td>
        <td><a href="mailto:${r.Email}">${r.Email || ''}</a></td>
        <td>${r.SFI || ''}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    resultsArea.innerHTML = html;
  } catch (err) {
    status.style.color = "red";
    status.textContent = "Could not find location for ZIP " + zip;
  }
}

function resetToDefault() {
  if (confirm("Reset roster to original 22 inspectors? All custom additions will be lost.")) {
    inspectors = [...defaultInspectors];
    saveInspectors();
  }
}

function exportCSV() {
  let csv = "First Name,Last Name,Address,City,State,Zip,Phone,Email,SFI #,Expires\n";
  inspectors.forEach(i => {
    csv += `"${i.First}","${i.Last}","${i.Address || ''}","${i.City}","${i.State}","${i.Zip}","${i.Phone || ''}","${i.Email || ''}","${i.SFI || ''}","${i.Expires || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', 'inspectors.csv');
  a.click();
}
